<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimal City Builder</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        // Escena, cámara y renderizador
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Iluminación
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 1, 1);
        scene.add(directionalLight);

        // Plano base (suelo)
        const groundGeometry = new THREE.PlaneGeometry(20, 20);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0xaaaaaa });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Material para bordes y ventanas
        const edgesMaterial = new THREE.LineBasicMaterial({ color: 0x000000 });
        const windowMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 }); // Amarillo para ventanas

        // Grupo para la ciudad
        const city = new THREE.Group();
        scene.add(city);

        // Posición inicial de la cámara
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        // Variables de control
        let isDragging = false;
        let previousX = 0;
        let previousY = 0;
        let rotationY = 0;
        let cameraHeight = 5;

        // Función para generar un color aleatorio
        function getRandomColor() {
            return Math.random() * 0xffffff;
        }

        // Función para añadir ventanas a un edificio
        function addWindows(building, height) {
            const windowSize = 0.2;
            const windowGeometry = new THREE.PlaneGeometry(windowSize, windowSize);

            // Añadir ventanas en las 4 caras
            for (let face = 0; face < 4; face++) {
                const offset = face * Math.PI / 2;
                for (let y = 0.5; y < height - 0.5; y += 0.5) {
                    const window = new THREE.Mesh(windowGeometry, windowMaterial);
                    window.position.y = y - height / 2;
                    window.position.x = Math.sin(offset) * 0.51;
                    window.position.z = Math.cos(offset) * 0.51;
                    window.rotation.y = -offset;
                    building.add(window);
                }
            }
        }

        // Función para añadir un edificio
        function addBuilding(x, z) {
            const height = Math.random() * 3 + 1;
            const geometry = new THREE.BoxGeometry(1, height, 1);
            const buildingMaterial = new THREE.MeshLambertMaterial({ color: getRandomColor() });
            const building = new THREE.Mesh(geometry, buildingMaterial);
            building.position.set(x, height / 2, z);
            
            // Añadir bordes
            const edges = new THREE.EdgesGeometry(geometry);
            const lines = new THREE.LineSegments(edges, edgesMaterial);
            building.add(lines);
            
            // Añadir ventanas
            addWindows(building, height);
            
            city.add(building);
        }

        // Controles táctiles y de ratón
        function onStart(event) {
            event.preventDefault();
            isDragging = true;
            const touch = event.touches ? event.touches[0] : event;
            previousX = touch.clientX;
            previousY = touch.clientY;
        }

        function onMove(event) {
            event.preventDefault();
            if (!isDragging) return;

            const touch = event.touches ? event.touches[0] : event;
            const deltaX = touch.clientX - previousX;
            const deltaY = touch.clientY - previousY;

            rotationY += deltaX * 0.01;
            cameraHeight = Math.max(2, Math.min(10, cameraHeight - deltaY * 0.05));

            previousX = touch.clientX;
            previousY = touch.clientY;
        }

        function onEnd(event) {
            event.preventDefault();
            isDragging = false;

            const touch = event.changedTouches ? event.changedTouches[0] : event;
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2(
                (touch.clientX / window.innerWidth) * 2 - 1,
                -(touch.clientY / window.innerHeight) * 2 + 1
            );
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);
            if (intersects.length > 0) {
                const point = intersects[0].point;
                addBuilding(point.x, point.z);
            }
        }

        // Eventos
        renderer.domElement.addEventListener('touchstart', onStart);
        renderer.domElement.addEventListener('touchmove', onMove);
        renderer.domElement.addEventListener('touchend', onEnd);
        renderer.domElement.addEventListener('mousedown', onStart);
        renderer.domElement.addEventListener('mousemove', onMove);
        renderer.domElement.addEventListener('mouseup', onEnd);

        // Animación
        function animate() {
            requestAnimationFrame(animate);

            // Actualizar posición de la cámara
            camera.position.x = Math.sin(rotationY) * 10;
            camera.position.z = Math.cos(rotationY) * 10;
            camera.position.y = cameraHeight;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }
        animate();

        // Redimensionar
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
